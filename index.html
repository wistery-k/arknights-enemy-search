<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="dev">
<title>敵情報検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <div class="topbar__titles">
      <h1>敵情報検索</h1>
      <p class="topbar__build" id="buildInfo" hidden></p>
    </div>
  </div>

  <div class="topbar__search">
    <input type="search" id="searchInput" placeholder="名前・図鑑番号・能力で検索" autocomplete="off">
  </div>

  <div class="topbar__count">
    <span id="resultCount">-</span><span class="topbar__count-label">体</span>
  </div>
</header>

<div class="layout">

  <aside class="filters" id="filters">
    <button class="filters__mobile-toggle" id="mobileToggle" aria-expanded="false">絞り込み条件を開く</button>
    <div class="filters__inner" id="filterGroups"></div>
    <button class="filters__reset" id="resetBtn">条件をすべて解除</button>
    <p class="filters__source" id="dataSource"></p>
  </aside>

  <main class="results">
    <div class="update-notice" id="updateNotice" hidden>
      <span>新しい版が公開されています。</span>
      <button type="button" id="reloadBtn">再読み込みして反映</button>
    </div>
    <section class="landing" id="landing" hidden>
      <h2 class="landing__title">地域から探す</h2>
      <p class="landing__hint">敵が初登場した章やイベントの地域で絞り込みます。「初登場コンテンツ」の絞り込みや検索欄からも探せます。</p>
      <div class="landing__grid" id="landingGrid"></div>
      <button type="button" class="landing__all" id="browseAllBtn">すべての敵を新しい順に見る</button>
    </section>
    <div class="results__toolbar" id="resultsToolbar">
      <div class="results__chips" id="activeChips"></div>
      <label class="results__sort">
        <span>並び順</span>
        <select id="sortSelect">
          <option value="new">初登場が新しい順</option>
          <option value="index">図鑑順</option>
          <option value="hp">HPが高い順</option>
          <option value="atk">攻撃力が高い順</option>
          <option value="def">防御力が高い順</option>
          <option value="res">術耐性が高い順</option>
          <option value="appear">登場コンテンツが多い順</option>
        </select>
      </label>
    </div>
    <div class="results__grid" id="resultsGrid"></div>
    <button class="results__more" id="moreBtn" hidden>さらに表示</button>
    <div class="results__empty" id="emptyState" hidden>
      <p>該当する敵が見つかりませんでした。</p>
      <p>絞り込み条件を減らすか、別のキーワードを試してください。</p>
    </div>
  </main>

</div>

<div class="detail" id="detailPanel" hidden>
  <div class="detail__scrim" id="detailScrim"></div>
  <div class="detail__card" id="detailCard" role="dialog" aria-modal="true"></div>
</div>

<script src="script.js"></script>
</body>
</html>
